<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f9ff">
<title>Switzen Home</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#f6f9ff;--card:#ffffff;--line:#d9e4f2;--text:#1f2a37;--muted:#6f7d92;
  --yellow:#ffd763;--yellow2:#ffbf45;--green:#30c776;--blue:#6d96ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 80% -10%,rgba(109,150,255,.18),transparent 36%),
  radial-gradient(circle at -10% 26%,rgba(255,215,99,.18),transparent 28%),
  linear-gradient(180deg,#fbfdff 0%,#f4f8ff 100%);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:680px;margin:auto;padding:18px 10px 48px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-size:31px;font-weight:900;letter-spacing:-1.4px;line-height:1}
.subtitle{margin-top:6px;color:var(--muted);font-size:13px}
.badge{padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);color:#6d7b92;font-size:9px;font-weight:800}
.card{background:linear-gradient(180deg,#ffffff,#f8fbff);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(79,107,160,.10)}
.status{margin-top:16px;padding:14px 15px}
.statusTop{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#b8c4d6}.dot.on{background:var(--green);box-shadow:0 0 11px rgba(53,215,134,.7)}
.statusTitle{font-size:16px;font-weight:850}.deviceText{margin:5px 0 0 18px;color:var(--muted);font-size:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid rgba(40,76,120,.08)}
.chip{padding:5px 7px;border-radius:999px;background:#eef4fb;color:#61718a;font-size:9px;font-weight:700}.chip.good{background:rgba(53,215,134,.11);color:#a7efc8}
.login{margin-top:10px;padding:12px}.login input{width:100%;background:#ffffff;color:#1f2a37;border:1px solid #d6e2f0;border-radius:11px;padding:10px;font-size:14px}.login button{width:100%;margin-top:7px;border:0;border-radius:11px;padding:10px;font-weight:850}
.reset{text-align:right;margin:4px 2px}.reset button{border:0;background:transparent;color:#7d8aa0;font-size:9px;padding:4px}
.quick{margin-top:10px;padding:11px}.quickTitle{font-size:10px;color:var(--muted);margin:0 0 7px 2px;font-weight:750}
.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:900}.btnOn{background:linear-gradient(135deg,var(--yellow),var(--yellow2));color:#151719}.btnOff{background:#dfe7f2;color:#243247}
.globalSchedule{margin-top:10px;padding:0;overflow:hidden}.headTitle{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:850}.iconBox{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,215,90,.18)}
.globalSchedule>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;cursor:pointer;list-style:none;border:0}
.globalSchedule>summary::-webkit-details-marker{display:none}
.globalSchedule>summary::before{content:none}
.globalSchedule>summary::after{content:"▾";color:#8290a4;font-size:14px;transition:.18s}
.globalSchedule[open]>summary::after{transform:rotate(180deg)}
.globalSummaryText{min-width:0}
.globalBody{padding:0 13px 13px}

.desc{margin-top:3px;color:var(--muted);font-size:10px}
.scheduleGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.scheduleRow{padding:9px;background:#f7faff;border:1px solid #e4edf7;border-radius:12px}
.schTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.schLabel{font-size:11px;font-weight:800}.checkWrap{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:9px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--yellow)}input[type=time]{width:100%;background:#ffffff;color:#1f2a37;border:1px solid #d6e2f0;border-radius:10px;padding:8px;font-size:13px;color-scheme:light}
.saveBtn{width:100%;margin-top:8px;border:1px solid #d6e2f0;background:#edf3fb;color:#243247;border-radius:11px;padding:9px;font-size:12px;font-weight:800}
.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:0 3px 7px}.sectionTitle strong{font-size:18px}.sectionTitle span{font-size:9px;color:#8190a6}
.roomHeader{margin-top:14px;padding:0 3px;color:#5f6f86;font-size:11px;font-weight:850}
.device{padding:11px 12px;margin-top:6px}.device.on{border-color:rgba(255,215,90,.36);background:linear-gradient(180deg,#fffdf5,#fff8e5)}
.deviceRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.left{display:flex;align-items:center;gap:9px}.dicon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#eef4fb;font-size:16px}
.name{font-size:15px;font-weight:850}.meta{margin-top:2px;color:var(--muted);font-size:9px}.stateWrap{display:flex;align-items:center;gap:6px}.st{font-size:9px;font-weight:850;color:#75839a;min-width:23px;text-align:right}.device.on .st{color:#b8860b}
.sw{width:48px;height:28px;border-radius:19px;background:#d9e3ef;position:relative}.knob{position:absolute;width:20px;height:20px;left:4px;top:4px;border-radius:50%;background:#fff;transition:.16s}.device.on .sw{background:linear-gradient(135deg,var(--yellow),var(--yellow2))}.device.on .knob{left:24px;background:#243247}
.pending{opacity:.75}.pending .sw::after{content:"";position:absolute;inset:-4px;border:1px solid rgba(111,168,255,.6);border-radius:26px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.2}}
details{margin-top:8px;border-top:1px solid rgba(40,76,120,.08);padding-top:7px}summary{list-style:none;color:#6f7d92;font-size:10px;font-weight:750;cursor:pointer}summary::-webkit-details-marker{display:none}summary::before{content:"⏱ "}
.note{margin-top:18px;color:#72809a;font-size:9px;line-height:1.55;text-align:center}.footer{margin-top:18px;padding-top:12px;border-top:1px solid rgba(40,76,120,.08);color:#7b879c;text-align:center;font-size:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#ffffff;border:1px solid #d9e4f2;color:#1f2a37;padding:10px 15px;border-radius:20px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;z-index:20;font-size:12px}#toast.show{opacity:.96}
@media(max-width:520px){.wrap{padding:16px 9px 44px}.brand{font-size:30px}.scheduleGrid{grid-template-columns:1fr 1fr}}

/* ===== V2.4 MOBILE 2-COLUMN DEVICE GRID ===== */
.deviceGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}
.roomHeader{
  margin-top:14px;
  margin-bottom:6px;
}
.deviceGrid .device{
  margin-top:0;
  min-width:0;
  padding:11px;
  border-radius:18px;
}
.deviceGrid .deviceRow{
  display:block;
}
.deviceGrid .left{
  gap:7px;
  align-items:center;
}
.deviceGrid .dicon{
  width:29px;
  height:29px;
  border-radius:9px;
  font-size:15px;
}
.deviceGrid .name{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.deviceGrid .meta{
  font-size:8px;
  margin-top:2px;
}
.deviceGrid .stateWrap{
  margin-top:10px;
  justify-content:space-between;
}
.deviceGrid .st{
  font-size:9px;
}
.deviceGrid .sw{
  width:45px;
  height:26px;
}
.deviceGrid .knob{
  width:18px;
  height:18px;
  top:4px;
  left:4px;
}
.deviceGrid .device.on .knob{
  left:23px;
}
.deviceGrid details{
  margin-top:8px;
  padding-top:7px;
}
.deviceGrid details summary{
  font-size:9px;
}
.deviceGrid .scheduleGrid{
  grid-template-columns:1fr 1fr;
}
.deviceGrid .scheduleRow{
  padding:8px;
}
.deviceGrid input[type=time]{
  font-size:12px;
  padding:7px 5px;
}
.deviceGrid .saveBtn{
  font-size:11px;
  padding:8px;
}

/* 예약을 펼친 카드만 두 칸 전체 폭 사용 */
.deviceGrid .device:has(details[open]){
  grid-column:1 / -1;
}

/* 콘센트처럼 예약이 없는 카드도 높이를 작게 유지 */
.deviceGrid .device:not(:has(details)){
  padding-bottom:12px;
}

@media(min-width:700px){
  .deviceGrid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .deviceGrid .device:has(details[open]){
    grid-column:span 2;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><div class="brand">Switzen Home</div><div class="subtitle">Cloud Remote · Bright Edition</div></div>
    <div class="badge">EXTERNAL</div>
  </div>

  <div class="card status">
    <div class="statusTop"><div id="dot" class="dot"></div><div id="conn" class="statusTitle">HiveMQ 연결 확인 중</div></div>
    <div id="deviceText" class="deviceText">D1 mini 상태 확인 전</div>
    <div class="chips"><div id="mqttChip" class="chip">MQTT</div><div id="devChip" class="chip">D1 mini</div><div id="rsChip" class="chip">RS485</div></div>
  </div>

  <div id="login" class="card login">
    <input id="pw" type="password" placeholder="switzenweb MQTT 비밀번호">
    <button onclick="connectCloud(false)">저장하고 연결</button>
  </div>
  <div class="reset"><button onclick="resetSavedPassword()">MQTT 비밀번호 초기화</button></div>

  <div class="card quick">
    <div class="quickTitle">QUICK CONTROL · 조명 9회로</div>
    <div class="quickGrid">
      <button class="btn btnOn" onclick="groupSet('ON')">전체 켜기</button>
      <button class="btn btnOff" onclick="groupSet('OFF')">전체 끄기</button>
    </div>
  </div>

  <details class="card globalSchedule">
    <summary>
      <div class="headTitle"><div class="iconBox">⏰</div><div class="globalSummaryText"><div>전체 조명 예약</div><div class="desc">눌러서 예약시간 설정</div></div></div>
    </summary>
    <div class="globalBody">
      <div id="globalScheduleArea"></div>
    </div>
  </details>

  <div class="section">
    <div class="sectionTitle"><strong>기기 제어</strong><span>실제 RS485 상태로 자동 보정</span></div>
    <div id="devices"></div>
  </div>

  <div class="note">명령을 누르면 화면은 즉시 반응합니다. 실제 상태 메시지가 도착하면 최종 상태로 자동 보정됩니다.</div>
  <div class="footer">Cony Home · Compact Grid · HiveMQ Cloud · BESTIN RS485</div>
</div>
<div id="toast"></div>

<script>
const HOST='261a8b00b16742908419be0277c596e9.s1.eu.hivemq.cloud';
const PORT=8884, USER='conyweb', KEY='conyhome_mqtt_password';
const defs=[
  ["거실","조명 1","조명"],["거실","조명 2","조명"],["거실","조명 3","조명"],
  ["주방","조명 1","조명"],["주방","조명 2","조명"],["주방","조명 3","조명"],
  ["방1","조명","조명"],["방2","조명","조명"],["방3","조명","조명"],
  ["방3","콘센트 1","콘센트"],["방3","콘센트 2","콘센트"]
];
const groups=[["거실",[1,2,3]],["주방",[4,5,6]],["방1",[7]],["방2",[8]],["방3",[9,10,11]]];
let states=Array(11).fill(false),known=Array(11).fill(false);
let schedules=Array.from({length:9},()=>({onEnabled:false,onHour:7,onMinute:0,offEnabled:false,offHour:23,offMinute:0}));
let globalSchedule={onEnabled:false,onHour:7,onMinute:0,offEnabled:false,offHour:23,offMinute:0};
let pendingDesired=Array(11).fill(null),pendingUntil=Array(11).fill(0);
let client=null,deviceOnline=false,rsOnline=false;

// 예약 details/time picker를 열어둔 동안 재렌더링 금지
function scheduleUiBusy(){
  const openDetail=document.querySelector('details[open]');
  const a=document.activeElement;
  const editingInput=a && (
    a.matches('input[type="time"]') ||
    a.matches('input[type="checkbox"]')
  );
  return !!openDetail || !!editingInput;
}

const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1450)}
function hhmm(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function parseSchedulePayload(s){const v=s.split(',').map(Number);if(v.length!==6)return null;return {onEnabled:!!v[0],onHour:v[1],onMinute:v[2],offEnabled:!!v[3],offHour:v[4],offMinute:v[5]}}
function schedulePayload(s){return `${s.onEnabled?1:0},${s.onHour},${s.onMinute},${s.offEnabled?1:0},${s.offHour},${s.offMinute}`}
function readSchedule(prefix){const on=$(`${prefix}OnT`).value.split(':').map(Number),off=$(`${prefix}OffT`).value.split(':').map(Number);return {onEnabled:$(`${prefix}OnE`).checked,onHour:on[0],onMinute:on[1],offEnabled:$(`${prefix}OffE`).checked,offHour:off[0],offMinute:off[1]}}
function scheduleHtml(prefix,s){return `<div class="scheduleGrid"><div class="scheduleRow"><div class="schTop"><div class="schLabel">켜기</div><label class="checkWrap"><input id="${prefix}OnE" type="checkbox" ${s.onEnabled?'checked':''}> 사용</label></div><input id="${prefix}OnT" type="time" value="${hhmm(s.onHour,s.onMinute)}"></div><div class="scheduleRow"><div class="schTop"><div class="schLabel">끄기</div><label class="checkWrap"><input id="${prefix}OffE" type="checkbox" ${s.offEnabled?'checked':''}> 사용</label></div><input id="${prefix}OffT" type="time" value="${hhmm(s.offHour,s.offMinute)}"></div></div>`}

function renderGlobal(){ $('globalScheduleArea').innerHTML=scheduleHtml('g',globalSchedule)+`<button class="saveBtn" onclick="saveGlobal()">전체 조명 예약 저장</button>` }

function renderDevices(){
  let h='';
  for(const [room,ids] of groups){
    h+=`<div class="roomHeader">${room}</div><div class="deviceGrid">`;
    for(const id of ids){
      const i=id-1,isPending=Date.now()<pendingUntil[i];
      let state=states[i],k=known[i];
      if(isPending&&pendingDesired[i]!==null){state=pendingDesired[i];k=true}
      const icon=defs[i][2]==='조명'?'💡':'🔌';
      h+=`<div class="card device ${k&&state?'on':''} ${isPending?'pending':''}">
        <div class="deviceRow">
          <div class="left">
            <div class="dicon">${icon}</div>
            <div>
              <div class="name">${defs[i][1]}</div>
              <div class="meta">C${String(id).padStart(2,'0')} · ${k?(state?'켜짐':'꺼짐'):'확인 중'}</div>
            </div>
          </div>
          <div class="stateWrap">
            <div class="st">${k?(state?'ON':'OFF'):'--'}</div>
            <div class="sw" onclick="toggle(${i})"><div class="knob"></div></div>
          </div>
        </div>
        ${i<9?`<details><summary>예약</summary>${scheduleHtml('c'+id,schedules[i])}<button class="saveBtn" onclick="saveIndividual(${id})">예약 저장</button></details>`:''}
      </div>`;
    }
    h+='</div>';
  }
  $('devices').innerHTML=h;
}

function ui(){
  const mq=client&&client.connected;
  $('dot').classList.toggle('on',mq&&deviceOnline&&rsOnline);
  $('mqttChip').textContent=mq?'MQTT 연결':'MQTT 대기';$('mqttChip').classList.toggle('good',mq);
  $('devChip').textContent=deviceOnline?'D1 mini ONLINE':'D1 mini OFFLINE';$('devChip').classList.toggle('good',deviceOnline);
  $('rsChip').textContent=rsOnline?'RS485 ONLINE':'RS485 OFFLINE';$('rsChip').classList.toggle('good',rsOnline);
  $('deviceText').textContent=deviceOnline?(rsOnline?'D1 mini · BESTIN RS485 정상':'D1 mini · RS485 확인 필요'):'D1 mini 상태 확인 전';
}

function optimistic(i,state,ms=2600){
  states[i]=state;known[i]=true;pendingDesired[i]=state;pendingUntil[i]=Date.now()+ms;
  if(!scheduleUiBusy()) renderDevices();
}
function acceptActual(i,state){
  if(Date.now()<pendingUntil[i]&&pendingDesired[i]===state){pendingDesired[i]=null;pendingUntil[i]=0}
  states[i]=state;known[i]=true;
  if(!scheduleUiBusy()) renderDevices();
}

function start(pw,save){
  if(!pw){toast('비밀번호를 입력하세요');return}
  if(client)try{client.end(true)}catch(e){}
  $('conn').textContent='HiveMQ Cloud 연결 중...';
  client=mqtt.connect(`wss://${HOST}:${PORT}/mqtt`,{username:USER,password:pw,clientId:'ConyWeb-'+Math.random().toString(16).slice(2),clean:true,connectTimeout:10000,reconnectPeriod:3000});
  client.on('connect',()=>{
    $('conn').textContent='HiveMQ Cloud 연결됨';
    $('login').style.display='none';
    if(save)try{localStorage.setItem(KEY,pw)}catch(e){}
    client.subscribe('conyhome/circuit/+/state');
    client.subscribe('conyhome/device/status');
    client.subscribe('conyhome/rs485/status');
    client.subscribe('conyhome/schedule/circuit/+/state');
    client.subscribe('conyhome/schedule/lights/state');
    ui();
  });
  client.on('reconnect',()=>{$('conn').textContent='HiveMQ 재연결 중...';ui()});
  client.on('close',ui);
  client.on('error',()=>{$('conn').textContent='HiveMQ 연결 실패';ui()});
  client.on('message',(topic,payload)=>{
    const msg=payload.toString().trim(),up=msg.toUpperCase();
    if(topic==='conyhome/device/status'){deviceOnline=up==='ONLINE';ui();return}
    if(topic==='conyhome/rs485/status'){rsOnline=up==='ONLINE';ui();return}
    if(topic==='conyhome/schedule/lights/state'){
      const s=parseSchedulePayload(msg);
      if(s){globalSchedule=s;if(!scheduleUiBusy())renderGlobal()}
      return
    }
    let m=topic.match(/^conyhome\/schedule\/circuit\/(\d\d)\/state$/);
    if(m){
      const i=parseInt(m[1],10)-1,s=parseSchedulePayload(msg);
      if(i>=0&&i<9&&s){schedules[i]=s;if(!scheduleUiBusy())renderDevices()}
      return
    }
    m=topic.match(/^conyhome\/circuit\/(\d\d)\/state$/);
    if(m){const i=parseInt(m[1],10)-1;if(i>=0&&i<11){if(up==='UNKNOWN'){known[i]=false;if(!scheduleUiBusy())renderDevices()}else acceptActual(i,up==='ON')}return}
  });
}

function connectCloud(auto=false){
  let pw='';
  if(auto){
    try{pw=localStorage.getItem(KEY)||''}catch(e){}
    if(!pw){$('conn').textContent='MQTT 비밀번호 입력 필요';$('login').style.display='block';return}
    start(pw,false);
  }else start($('pw').value,true);
}

function resetSavedPassword(){
  try{localStorage.removeItem(KEY)}catch(e){}
  if(client)try{client.end(true)}catch(e){}
  client=null;deviceOnline=false;rsOnline=false;
  $('login').style.display='block';$('pw').value='';$('conn').textContent='HiveMQ 연결 안 됨';ui();
}

function toggle(i){
  if(!client||!client.connected||!deviceOnline){toast('D1 mini 연결을 확인하세요');return}
  const target=!(known[i]&&states[i]);
  optimistic(i,target);
  client.publish(`conyhome/circuit/${String(i+1).padStart(2,'0')}/set`,target?'ON':'OFF',{qos:0,retain:false});
}

function groupSet(s){
  if(!client||!client.connected||!deviceOnline){toast('D1 mini 연결을 확인하세요');return}
  const state=s==='ON';

  // 전체 명령은 9개 상태를 먼저 한 번에 바꾸고 화면을 한 번만 다시 그림
  // → 모바일에서 개별 스위치가 즉시 확실하게 따라오게 함
  for(let i=0;i<9;i++){
    states[i]=state;
    known[i]=true;
    pendingDesired[i]=state;
    pendingUntil[i]=Date.now()+5500;
  }

  if(!scheduleUiBusy()) renderDevices();

  client.publish('conyhome/group/lights/set',s,{qos:0,retain:false});
  toast(state?'조명 전체 켜기':'조명 전체 끄기');
}

function saveIndividual(id){
  if(!client||!client.connected||!deviceOnline){toast('D1 mini 연결을 확인하세요');return}
  const i=id-1,s=readSchedule('c'+id);schedules[i]=s;renderDevices();
  client.publish(`conyhome/schedule/circuit/${String(id).padStart(2,'0')}/set`,schedulePayload(s),{qos:0,retain:false});
  toast('개별 예약 저장');
}

function saveGlobal(){
  if(!client||!client.connected||!deviceOnline){toast('D1 mini 연결을 확인하세요');return}
  globalSchedule=readSchedule('g');renderGlobal();
  client.publish('conyhome/schedule/lights/set',schedulePayload(globalSchedule),{qos:0,retain:false});
  toast('전체 조명 예약 저장');
}

renderGlobal();renderDevices();ui();window.addEventListener('load',()=>connectCloud(true));
setInterval(()=>{
  let changed=false;
  for(let i=0;i<11;i++){
    if(pendingUntil[i]&&Date.now()>=pendingUntil[i]){
      pendingUntil[i]=0;
      pendingDesired[i]=null;
      changed=true;
    }
  }
  if(changed && !scheduleUiBusy()) renderDevices();
},500);
</script>
