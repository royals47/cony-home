<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Cony Home</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{--bg:#0d1016;--card:#171c26;--line:#293141;--text:#f4f6fa;--muted:#929bab;--yellow:#ffd85b;--green:#31d47b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 14px 65px}
.head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:37px;font-weight:850;letter-spacing:-1.5px}.sub{margin-top:7px;color:var(--muted);font-size:16px}.badge{padding:7px 9px;border:1px solid var(--line);border-radius:99px;color:#aeb7c6;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:25px}
.status{margin-top:25px;padding:20px}.statusTop{display:flex;gap:11px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:#6b7481}.dot.on{background:var(--green);box-shadow:0 0 12px rgba(49,212,123,.65)}.conn{font-size:19px;font-weight:800}.device{margin:7px 0 0 22px;color:var(--muted);font-size:13px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px;padding-top:14px;border-top:1px solid #252c38}.pill{padding:6px 9px;border-radius:99px;background:#222a37;color:#aeb7c6;font-size:11px}.pill.good{color:#aef2ca;background:rgba(49,212,123,.10)}
.login{margin-top:14px;padding:18px}.login input{width:100%;background:#0f131a;border:1px solid #354052;border-radius:14px;color:#fff;padding:13px;font-size:15px}.login button{margin-top:9px;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800}
.reset{text-align:right;margin:7px 3px}.reset button{border:0;background:transparent;color:#7f8998;font-size:11px}
.master{margin-top:14px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.master button{border:0;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:850}.onBtn{background:var(--yellow)}.offBtn{background:#303847;color:#fff}
.groupTitle{font-size:20px;font-weight:850;margin:25px 3px 9px}.item{padding:18px;margin-top:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.name{font-size:21px;font-weight:800}.info{margin-top:4px;color:var(--muted);font-size:12px}.stateBox{display:flex;gap:8px;align-items:center}.st{font-size:12px;color:#8d97a7;font-weight:800;min-width:31px;text-align:right}.sw{width:59px;height:35px;border-radius:22px;background:#303847;position:relative}.kn{position:absolute;left:4px;top:4px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}.item.on{border-color:#675827;background:#1c1e1d}.item.on .sw{background:var(--yellow)}.item.on .kn{left:28px;background:#171717}.item.on .st{color:#ffe993}
.note{margin-top:24px;color:#6f7a8b;font-size:11px;line-height:1.65}.footer{margin-top:27px;padding-top:17px;border-top:1px solid #1e2530;text-align:center;color:#657082;font-size:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#050608;color:#fff;padding:10px 15px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}#toast.show{opacity:.95}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><div><div class="title">Cony Home</div><div class="sub">Cloud Remote Control · 11 Circuits</div></div><div class="badge">EXTERNAL</div></div>

 <div class="card status">
  <div class="statusTop"><div id="dot" class="dot"></div><div id="conn" class="conn">HiveMQ 연결 확인 중</div></div>
  <div id="device" class="device">D1 mini 상태 확인 전</div>
  <div class="pills"><div id="mqttPill" class="pill">MQTT 대기</div><div id="devPill" class="pill">D1 mini 확인 중</div><div id="rsPill" class="pill">RS485 확인 중</div></div>
 </div>

 <div id="login" class="card login">
  <input id="pw" type="password" placeholder="conyweb MQTT 비밀번호">
  <button onclick="connectCloud(false)">저장하고 연결</button>
 </div>
 <div class="reset"><button onclick="resetSavedPassword()">MQTT 비밀번호 초기화</button></div>

 <div class="card master">
  <button class="onBtn" onclick="groupSet('lights','ON')">조명 전체 켜기</button>
  <button class="offBtn" onclick="groupSet('lights','OFF')">조명 전체 끄기</button>
 </div>

 <div id="list"></div>
 <div class="note">조명 전체 버튼은 9개 조명만 제어하며 콘센트는 포함하지 않습니다. 표시 상태는 D1 mini가 BESTIN RS485에서 확인한 실제 상태를 MQTT로 전달받아 갱신합니다.</div>
 <div class="footer">Cony Home · LOLIN D1 mini V4 · HiveMQ Cloud · BESTIN RS485</div>
</div>
<div id="toast"></div>

<script>
const HOST='261a8b00b16742908419be0277c596e9.s1.eu.hivemq.cloud',PORT=8884,USER='conyweb',KEY='conyhome_mqtt_password';
const defs=[
 ["거실","조명 1"],["거실","조명 2"],["거실","조명 3"],
 ["주방","조명 1"],["주방","조명 2"],["주방","조명 3"],
 ["방1","조명"],["방2","조명"],["방3","조명"],
 ["방3","콘센트 1"],["방3","콘센트 2"]
];
const groups=[["거실",[1,2,3]],["주방",[4,5,6]],["방1",[7]],["방2",[8]],["방3",[9,10,11]]];
let states=Array(11).fill(false),known=Array(11).fill(false),client=null,deviceOnline=false,rsOnline=false;
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function render(){let h="";for(const[g,ids]of groups){h+=`<div class="groupTitle">${g}</div>`;for(const id of ids){const i=id-1;h+=`<div class="card item ${known[i]&&states[i]?'on':''}"><div class="row"><div><div class="name">${defs[i][1]}</div><div class="info">Circuit ${String(id).padStart(2,'0')} · ${known[i]?(states[i]?'켜짐':'꺼짐'):'상태 확인 중'}</div></div><div class="stateBox"><div class="st">${known[i]?(states[i]?'ON':'OFF'):'--'}</div><div class="sw" onclick="toggle(${i})"><div class="kn"></div></div></div></div></div>`}}$('list').innerHTML=h}
function ui(){const mq=client&&client.connected;$('dot').classList.toggle('on',mq);$('mqttPill').textContent=mq?'MQTT 연결됨':'MQTT 대기';$('mqttPill').classList.toggle('good',mq);$('devPill').textContent=deviceOnline?'D1 mini ONLINE':'D1 mini 확인 중';$('devPill').classList.toggle('good',deviceOnline);$('rsPill').textContent=rsOnline?'RS485 ONLINE':'RS485 OFFLINE';$('rsPill').classList.toggle('good',rsOnline);$('device').textContent=deviceOnline?'D1 mini · ONLINE':'D1 mini 상태 확인 전'}
function start(pw,save){if(!pw){toast('비밀번호를 입력하세요');return}if(client)try{client.end(true)}catch(e){};$('conn').textContent='HiveMQ Cloud 연결 중...';client=mqtt.connect(`wss://${HOST}:${PORT}/mqtt`,{username:USER,password:pw,clientId:'ConyWeb-'+Math.random().toString(16).slice(2),clean:true,connectTimeout:10000,reconnectPeriod:3000});client.on('connect',()=>{$('conn').textContent='HiveMQ Cloud 연결됨';$('login').style.display='none';if(save)try{localStorage.setItem(KEY,pw)}catch(e){};client.subscribe('conyhome/circuit/+/state');client.subscribe('conyhome/device/status');client.subscribe('conyhome/rs485/status');ui()});client.on('reconnect',()=>{$('conn').textContent='HiveMQ 재연결 중...';ui()});client.on('close',ui);client.on('error',()=>{$('conn').textContent='HiveMQ 연결 실패';ui()});client.on('message',(topic,payload)=>{const m=payload.toString().trim().toUpperCase();if(topic==='conyhome/device/status'){deviceOnline=m==='ONLINE';ui();return}if(topic==='conyhome/rs485/status'){rsOnline=m==='ONLINE';ui();return}const x=topic.match(/^conyhome\/circuit\/(\d\d)\/state$/);if(x){const i=parseInt(x[1],10)-1;if(i>=0&&i<11){if(m==='UNKNOWN'){known[i]=false}else{known[i]=true;states[i]=m==='ON'}render()}}})}
function connectCloud(auto=false){let pw='';if(auto){try{pw=localStorage.getItem(KEY)||''}catch(e){};if(!pw){$('conn').textContent='MQTT 비밀번호 입력 필요';$('login').style.display='block';return}start(pw,false)}else start($('pw').value,true)}
function resetSavedPassword(){try{localStorage.removeItem(KEY)}catch(e){};if(client)try{client.end(true)}catch(e){};client=null;deviceOnline=false;rsOnline=false;$('login').style.display='block';$('pw').value='';$('conn').textContent='HiveMQ 연결 안 됨';ui()}
function send(i,s){if(!client||!client.connected){toast('Cloud 연결을 확인하세요');return}client.publish(`conyhome/circuit/${String(i+1).padStart(2,'0')}/set`,s,{qos:0,retain:false});toast(`${defs[i][0]} ${defs[i][1]} ${s==='ON'?'켜기':'끄기'}`)}
function toggle(i){send(i,known[i]&&states[i]?'OFF':'ON')}
function groupSet(g,s){if(!client||!client.connected){toast('Cloud 연결을 확인하세요');return}client.publish(`conyhome/group/${g}/set`,s,{qos:0,retain:false});toast(s==='ON'?'조명 전체 켜기':'조명 전체 끄기')}
render();ui();window.addEventListener('load',()=>connectCloud(true));
</script>
</body>
</html>
